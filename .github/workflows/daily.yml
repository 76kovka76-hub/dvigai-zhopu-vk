name: VK exercise auto-publisher

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "30 6 * * *"
    - cron: "0 8 * * *"
    - cron: "30 9 * * *"
    - cron: "0 11 * * *"
    - cron: "30 12 * * *"
    - cron: "0 14 * * *"
    - cron: "30 15 * * *"
    - cron: "0 17 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:

concurrency:
  group: daily-vk-exercises
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Publish one unique exercise
        env:
          VK_ACCESS_TOKEN: \${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: \${{ secrets.VK_GROUP_ID }}
          GITHUB_EVENT_NAME: \${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: \${{ github.event.schedule }}
        run: python main.py

      - name: Save publication history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add post_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update VK publication history"
            git push
          else
            echo "No history changes to commit."
          fi
